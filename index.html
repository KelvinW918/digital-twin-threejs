<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Digital Twin · 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ============================================
    CANVAS 3D - SIEMPRE DETRÁS
    ============================================ -->
    <div id="canvas-container"></div>

    <!-- ============================================
    TOP BAR - MINIMALISTA CON SVG ICONS
    ============================================ -->
    <nav id="topbar">
        <div class="topbar-left">
            <!-- Logo SVG en lugar de emoji -->
            <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
            <span class="logo-text">Digital Twin</span>
            <span class="live-badge">
                <span class="live-dot"></span>
                LIVE
            </span>
        </div>
        <div class="topbar-right">
            <button id="reset-view-btn" class="btn-icon" title="Reset View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9m0 0v6m0-6h-6"/>
                </svg>
            </button>
            <button id="toggle-stats-btn" class="btn-icon" title="Toggle Stats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- ============================================
    STATS PANEL - COLAPSABLE CON SVG ICONS
    ============================================ -->
    <div id="stats-panel" class="stats-collapsed">
        <div class="stats-handle" id="stats-handle">
            <!-- Icono de gráfico SVG -->
            <svg class="handle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
            </svg>
            <span class="handle-text">Inventory</span>
            <span class="handle-badge" id="total-badge">300</span>
        </div>
        
        <div class="stats-body">
            <div class="stats-grid">
                <div class="stat-mini high">
                    <span class="stat-mini-dot"></span>
                    <span class="stat-mini-value" id="high-count">0</span>
                    <span class="stat-mini-label">High</span>
                </div>
                <div class="stat-mini medium">
                    <span class="stat-mini-dot"></span>
                    <span class="stat-mini-value" id="medium-count">0</span>
                    <span class="stat-mini-label">Medium</span>
                </div>
                <div class="stat-mini low">
                    <span class="stat-mini-dot"></span>
                    <span class="stat-mini-value" id="low-count">0</span>
                    <span class="stat-mini-label">Low</span>
                </div>
            </div>
            
            <div class="stats-details">
                <div class="stat-row">
                    <!-- Icono de caja SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                        <line x1="12" y1="22.08" x2="12" y2="12"/>
                    </svg>
                    <span>Total</span>
                    <strong id="total-count">0</strong>
                </div>
                <div class="stat-row">
                    <!-- Icono de porcentaje SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 5L5 19"/>
                        <circle cx="6.5" cy="6.5" r="2.5"/>
                        <circle cx="17.5" cy="17.5" r="2.5"/>
                    </svg>
                    <span>Fill Rate</span>
                    <strong id="fill-rate">0%</strong>
                </div>
                <div class="stat-row">
                    <!-- Icono de estado SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>Status</span>
                    <strong style="color: #34d399;">Operational</strong>
                </div>
            </div>
            
            <div class="stats-live">
                <span class="live-dot small"></span>
                <span id="live-feed-text">SYSTEM LIVE</span>
            </div>
        </div>
    </div>

    <!-- ============================================
    TOOLTIP - CON SVG ICONS
    ============================================ -->
    <div id="tooltip" class="tooltip-hidden">
        <div class="tooltip-content">
            <div class="tooltip-id" id="product-id">Product</div>
            <div class="tooltip-stock" id="product-stock">0%</div>
            <div class="tooltip-level" id="product-level">High</div>
        </div>
    </div>

    <!-- ============================================
    CONTROLS HELP - CON SVG ICONS
    ============================================ -->
    <div id="controls-help">
        <span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            Drag to rotate
        </span>
        <span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            Scroll to zoom
        </span>
    </div>

    <!-- ============================================
    THREE.JS IMPORTS
    ============================================ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
